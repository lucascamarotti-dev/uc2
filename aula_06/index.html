  <body>
    <main>

<div class="linha">
          <div class="card">
        <h3>Dr. Enéas Ferreira Carneiro - Médico, Político e Professor</h3>
        <figure>
          <img
            src="./assets/img/1721957.jpeg"
            height="200px"
            alt="Foto do Dr. Enéas Ferreira Carneiro, médico, político e professor brasileiro. Ele é conhecido por sua aparência distinta, com cabelo grisalho e óculos de armação grossa. A imagem mostra o Dr. Enéas em um ambiente formal, possivelmente em um evento ou conferência, vestindo um terno escuro e gravata. Ele está sorrindo levemente, transmitindo uma expressão de confiança e seriedade."
          />
          <figcaption>Dr. Enéas Ferreira Carneiro</figcaption>
        </figure>
        <button>Ir para o perfil</button>
      </div>
      <div class="card">
        <h3>
          Dr. Enéas Ferreira Carneiro numa convenção do PRONA (Partido de
          Reedificação da Ordem Nacional)
        </h3>
        <figure>
          <img
            src="./assets/img/eneas.jpg"
            height="200px"
            alt="Foto do Dr. Enéas Ferreira Carneiro, médico cardiologista, político e professor de física, medicina e matemática brasileiro, durante uma convenção do PRONA (Partido de Reedificação da Ordem Nacional). Ele está em um palco, cercado por outros membros do partido, vestindo um terno escuro e gravata. A imagem captura o Dr. Enéas em um momento de discurso ou apresentação, com expressão séria e determinada, refletindo seu compromisso com suas convicções políticas."
          />
          <figcaption>Dr. Enéas Ferreira Carneiro</figcaption>
        </figure>
        <button>Ir para o perfil</button>
      </div>
    </div>
    </main>
